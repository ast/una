# What the watch and the simulator (native_sim) share. The watch's hardware
# is configured in boards/una_watch.conf, the simulator in
# boards/native_sim_native_64.conf.

CONFIG_GPIO=y
CONFIG_INPUT=y
CONFIG_REBOOT=y
CONFIG_MAIN_STACK_SIZE=8192
# The UI must not be able to starve the shell: a frame is 35 ms of busy work.
CONFIG_MAIN_THREAD_PRIORITY=10
CONFIG_SHELL_THREAD_PRIORITY_OVERRIDE=y
CONFIG_SHELL_THREAD_PRIORITY=5

# Display and UI
CONFIG_DISPLAY=y
CONFIG_LVGL=y
CONFIG_LV_Z_MEM_POOL_SIZE=65536
CONFIG_LV_COLOR_DEPTH_16=y
# One full frame per flush: the panel is always rewritten whole.
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_LV_Z_FULL_REFRESH=y
CONFIG_LV_Z_SHELL=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_FONT_MONTSERRAT_48=y

# Shell
CONFIG_LOG=y
CONFIG_LOG_CMDS=y
CONFIG_SHELL=y
CONFIG_SHELL_PROMPT_UART="una:~$ "
CONFIG_SHELL_VT100_COLORS=n
CONFIG_SHELL_STACK_SIZE=6144
CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=y
CONFIG_GPIO_SHELL=y
CONFIG_INPUT_SHELL=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_BASE64=y

CONFIG_RTC=y
CONFIG_RTC_SHELL=y

# Settings in internal flash (storage partition)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y
CONFIG_ZMS=y
CONFIG_SETTINGS_ZMS=y
