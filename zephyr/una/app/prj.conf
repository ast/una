CONFIG_GPIO=y
CONFIG_INPUT=y
CONFIG_REBOOT=y
CONFIG_HWINFO=y
CONFIG_WATCHDOG=y
CONFIG_MAIN_STACK_SIZE=8192
# The UI must not be able to starve the shell: a frame is 35 ms of busy work.
CONFIG_MAIN_THREAD_PRIORITY=10
CONFIG_SHELL_THREAD_PRIORITY_OVERRIDE=y
CONFIG_SHELL_THREAD_PRIORITY=5

# Both serial ports are set up in src/usb.c; the board default does only one.
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n

# Display and UI
CONFIG_DISPLAY=y
CONFIG_LVGL=y
CONFIG_LV_Z_MEM_POOL_SIZE=65536
CONFIG_LV_COLOR_DEPTH_16=y
# One full frame per flush: the panel is always rewritten whole.
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_LV_Z_FULL_REFRESH=y
CONFIG_LV_Z_SHELL=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_28=y

# Shell on the first USB serial port
CONFIG_LOG=y
CONFIG_SHELL=y
CONFIG_SHELL_PROMPT_UART="una:~$ "
CONFIG_SHELL_VT100_COLORS=n
CONFIG_SHELL_BACKEND_SERIAL_CHECK_DTR=y
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=y
CONFIG_GPIO_SHELL=y
CONFIG_HWINFO_SHELL=y
CONFIG_INPUT_SHELL=y
CONFIG_DEVMEM_SHELL=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_BASE64=y

# mcumgr on the second USB serial port: upload a new image, test it, reset
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_ZCBOR=y
CONFIG_NET_BUF=y
CONFIG_CRC=y
CONFIG_MCUMGR=y
CONFIG_UART_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUBOOT_SHELL=y
CONFIG_MCUMGR_GRP_OS_BOOTLOADER_INFO=y
CONFIG_MCUMGR_GRP_OS_INFO=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION="0.0.4"

# Bluetooth: Zephyr's host, BlueNRG-2N as controller
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_BLUENRG_ACI=y
CONFIG_BT_HCI_ACL_FLOW_CONTROL=n
CONFIG_BT_DEVICE_NAME="UNA Zephyr"
CONFIG_BT_SHELL=y
# The host's crypto (PSA) allocates
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=32768
CONFIG_LOG_BUFFER_SIZE=16384

CONFIG_I2C=y
CONFIG_I2C_SHELL=y
CONFIG_SENSOR=y

# Stop 2 whenever nothing runs and USB is off
CONFIG_PM=y
