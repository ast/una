# The watch with PixArt's closed library on the heart-rate sensor, and the
# shell command "hrref" (src/hr_ref.c): what the library does on the bus is
# written to /USER:/Log/PPG/, with the samples and the pulse it makes of them.
#
#   west build -b una_watch --sysbuild -d build/hrref zephyr/una/app -- \
#     -DEXTRA_CONF_FILE=hr-ref.conf
#
# The library is PixArt's, passed on by UNA as a binary, and is not in the
# repository. It is looked for in the stock kernel under refs/;
# CONFIG_UNA_PIXART_DIR says where else.
CONFIG_UNA_PIXART_REF=y
# The library passes floats in the FPU's registers, so all of the watch must.
CONFIG_FPU=y
CONFIG_FP_HARDABI=y
CONFIG_FPU_SHARING=y
# And it wants the mathematics and qsort of a full C library.
CONFIG_NEWLIB_LIBC=y
# That library has an initializer of its own to be run at boot.
CONFIG_STATIC_INIT_GNU=y
