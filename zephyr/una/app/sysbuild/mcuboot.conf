# MCUboot is started by the stock UNA bootloader and sits at 0x08060000.

# The board puts the console on USB; the bootloader has none.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_LOG=n

# Serial recovery (mcumgr over the USB serial port) when SW1 is held at reset
# or when there is no image to start.
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_CDC_ACM=y
CONFIG_BOOT_SERIAL_CDC_ACM_MANUFACTURER_STRING="UNA"
CONFIG_BOOT_SERIAL_CDC_ACM_PRODUCT_STRING="UNA Watch MCUboot"
CONFIG_BOOT_SERIAL_NO_APPLICATION=y
CONFIG_MCUBOOT_SERIAL_DIRECT_IMAGE_UPLOAD=y
CONFIG_BOOT_SERIAL_IMG_GRP_IMAGE_STATE=y
CONFIG_GPIO=y
