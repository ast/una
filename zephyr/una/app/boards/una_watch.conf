# The watch itself: its hardware, storage, Bluetooth and firmware update.

CONFIG_HWINFO=y
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_WATCHDOG=y

# Both serial ports are set up in src/usb.c; the board default does only one.
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n

# Shell on the first USB serial port
CONFIG_SHELL_BACKEND_SERIAL_CHECK_DTR=y
CONFIG_HWINFO_SHELL=y
CONFIG_DEVMEM_SHELL=y

# mcumgr on the second USB serial port: upload a new image, test it, reset
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_ZCBOR=y
CONFIG_NET_BUF=y
CONFIG_CRC=y
CONFIG_MCUMGR=y
CONFIG_UART_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUBOOT_SHELL=y
CONFIG_MCUMGR_GRP_OS_BOOTLOADER_INFO=y
CONFIG_MCUMGR_GRP_OS_INFO=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Bluetooth: Zephyr's host, with the BlueNRG-2N as a plain controller (ST's
# firmware 3.4.0 or later in it: see bnrg-update.conf). The chip takes ST's
# commands for its address, counts no packets back to the host and knows
# nothing of Zephyr's vendor commands.
CONFIG_SPI=y
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_BLUENRG_ACI=y
CONFIG_BT_HCI_ACL_FLOW_CONTROL=n
CONFIG_BT_HCI_VS=n
CONFIG_BT_DEVICE_NAME="UNA Watch"
CONFIG_BT_DEVICE_APPEARANCE=192
# The serial line to the phone: src/bluetooth.c has its own instance of the
# service, for a paired phone only
CONFIG_BT_ZEPHYR_NUS=y
CONFIG_BT_ZEPHYR_NUS_DEFAULT_INSTANCE=n
# Pairing: LE Secure Connections only, by the passkey the watch shows. The
# bonds are kept in settings; a fifth phone takes the place of the oldest.
CONFIG_BT_SMP=y
# No database hash for a phone to keep the services by. With it, Android
# connects, encrypts, and then asks nothing more: Gadgetbridge waits for ever
# (tried again on 23 Nov, with the same phone and bond: stuck with it, well
# without). The price: a paired phone is not told when the services change,
# so the serial service keeps its place (see src/bluetooth.c) and what is
# added after it is found by a phone only when it pairs anew.
CONFIG_BT_GATT_CACHING=n
# Battery level and what the device is, in the standard way, for any app
CONFIG_BT_BAS=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_MODEL_NUMBER_STR="UNA Watch"
CONFIG_BT_DIS_MANUF_NAME_STR="Una Watch Ltd"
CONFIG_BT_DIS_PNP=n
# The pulse in the standard way too: the sensor is on while an app listens
CONFIG_BT_HRS=y
CONFIG_BT_HCI_ERR_TO_STR=y
CONFIG_BT_SECURITY_ERR_TO_STR=y
CONFIG_BT_SMP_SC_PAIR_ONLY=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
# Its keys are made of the SoC's random numbers (&rng); the host's
# cryptography (PSA) allocates.
CONFIG_ENTROPY_GENERATOR=y
# Pairing was seen to leave the stack's receiving thread 100 bytes of 1200.
CONFIG_BT_RX_STACK_SIZE=2048
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=32768
# As long a packet as the chip carries in one piece
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
# As many as the chip says it holds
CONFIG_BT_BUF_ACL_TX_COUNT=7
# The pace the watch would like, asked for by src/bluetooth.c once the phone
# has opened the line and not by the stack some seconds into any connection:
# 100 to 200 ms, of which four in five may be skipped, lost after 6 s.
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=80
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=160
CONFIG_BT_PERIPHERAL_PREF_LATENCY=4
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=600

CONFIG_I2C=y
CONFIG_I2C_SHELL=y
CONFIG_SENSOR=y
CONFIG_PWM=y

# Stop 2 whenever nothing runs and USB is off
CONFIG_PM=y
CONFIG_STATS=y
CONFIG_STATS_NAMES=y
CONFIG_STATS_SHELL=y
CONFIG_PM_STATS=y
CONFIG_GPIO_HOGS=y

# Storage: eMMC, the stock user volume (exFAT) at /USER:
CONFIG_DISK_ACCESS=y
CONFIG_SDMMC_STM32_EMMC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_EXFAT=y
CONFIG_FS_FATFS_CUSTOM_MOUNT_POINT_COUNT=1
CONFIG_FS_FATFS_CUSTOM_MOUNT_POINTS="USER"
CONFIG_FS_FATFS_MOUNT_MKFS=n
CONFIG_FILE_SYSTEM_SHELL=y
CONFIG_MCUMGR_GRP_FS=y
CONFIG_MCUMGR_GRP_FS_MAX_FILE_SIZE_4GB=y

# Telemetry: the log, kept on the eMMC by Zephyr's file-system log backend.
# 32 files of 1 MB, oldest overwritten.
CONFIG_LOG_BACKEND_FS=y
# Several threads use the volume (log, shell, mcumgr). Re-entrancy needs the
# long-file-name buffer on the caller's stack, hence the larger stacks.
CONFIG_FS_FATFS_REENTRANT=y
CONFIG_FS_FATFS_LFN_MODE_STACK=y
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=4096
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_LOG_BACKEND_FS_DIR="/USER:/Log/Zephyr"
CONFIG_LOG_BACKEND_FS_FILE_PREFIX="log."
CONFIG_LOG_BACKEND_FS_FILE_SIZE=1048576
CONFIG_LOG_BACKEND_FS_FILES_LIMIT=32
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_SCHED_THREAD_USAGE=y
CONFIG_SCHED_THREAD_USAGE_ALL=y

# GNSS: the Airoha receiver, off until the recorder asks for it
CONFIG_GNSS=y
CONFIG_GNSS_SATELLITES=y
