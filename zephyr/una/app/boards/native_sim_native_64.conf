# The simulator: the UI and shell as a Linux program. See src/sim.c.

# Works without a GPU and with SDL_VIDEODRIVER=dummy (no window).
CONFIG_SDL_DISPLAY_USE_HARDWARE_ACCELERATOR=n

# The watch has no touch screen. LVGL would poll one 30 times a second.
CONFIG_LV_Z_POINTER_FROM_CHOSEN_TOUCH=n

# The user volume is a directory of the computer: -volume=<dir>:/USER
CONFIG_FILE_SYSTEM_NATIVE_MOUNT=y
CONFIG_FILE_SYSTEM_SHELL=y

# An emulated GNSS receiver, moved about with "sim gps" and "sim move"
CONFIG_GNSS=y
CONFIG_GNSS_EMUL_MANUAL_UPDATE=y
CONFIG_PM_DEVICE=y
