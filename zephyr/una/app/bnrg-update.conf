# The watch as a tool that loads the radio chip's firmware: no Bluetooth, and
# the shell commands "bnrg info" and "bnrg update" (src/bnrg_update.c).
#
#   west build -b una_watch --sysbuild -d build/bnrg zephyr/una/app -- \
#     -DEXTRA_CONF_FILE=bnrg-update.conf
#
# The image is ST's (STSW-BNRG2N, fw_images/BlueNRG_2N_FW_V3_4_0.bin in the
# zip) and not ours to pass on, so it is not in the repository. It is looked
# for in firmware/ble/; CONFIG_UNA_BNRG_FW says where else.
CONFIG_BT=n
CONFIG_UNA_BNRG_UPDATE=y
